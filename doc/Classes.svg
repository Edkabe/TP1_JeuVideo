<text x="64" y="2416" class="group-title">RELATIONS PRINCIPALES</text>
<text x="64" y="2450" class="relation">Engine possède Window, ResourceManager et Settings · ResourceManager référence des Resource partagées · Texture et Font héritent de Resource.</text>
<text x="64" y="2482" class="relation">SceneManager possède des IScene; chaque IScene possède son EventManager · les scènes concrètes héritent de IScene · les contrôles interactifs héritent de EventObserver.</text>
<text x="64" y="2508" class="note">Image référence Texture · Label référence Font · Button compose Label · Selector compose deux Button et un Label · les contrôles possèdent leurs objets OpenGL.</text>
</svg>
